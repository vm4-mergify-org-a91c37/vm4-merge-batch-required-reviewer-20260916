merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
    branch_protection_injection_mode: merge
    queue_conditions: true
    merge_conditions:
      - check-success = VM4 Approval Dismissal Delay
      - '#approved-reviews-by >= 1'
pull_request_rules: []
